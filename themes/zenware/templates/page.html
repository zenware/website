{% extends "base.html" %}
{% block content %}
<article>
  <h1>{{ page.title }}</h1>
  {% if page.date %}<p class="meta"><time datetime="{{ page.date }}">{{ page.date | date(format="%B %e, %Y") }}</time>
  {% for tag in page.taxonomies.tags | default(value=[]) %} · <a href="{{ get_taxonomy_url(kind="tags", name=tag) | safe }}">#{{ tag }}</a>{% endfor %}</p>{% endif %}
  {{ page.content | safe }}
</article>
{% endblock content %}
