# zenware theme — see themes/zenware/README.md for every option.
base_url = "https://www.jaylooney.dev"

title = "Jay Looney"
description = "Jay Looney — software engineer building reliable systems across data, infrastructure & security. ~5 years in ICS/OT (Verve, Dragos). Open to roles, consulting & advisory."
#theme = "marginalia"
theme = "zenware"

default_language = "en"
compile_sass = true
minify_html = true
generate_feeds = true

taxonomies = [
    {name = "tags", feed = true},
]

[markdown.highlighting]
code = true
style = "class"
theme = "catppuccin-mocha"   # only used to generate static/giallo.css; zenware styles the z-* classes itself
bottom_footnotes = true
render_emoji = false
external_links_target_blank = true
external_links_no_follow = false
external_links_no_referrer = false
smart_punctuation = false

[extra]
author = "Jay Looney"
title_addition = "Software Engineer"

# Main navigation (top of every page)
menu = [
    {url = "about/", name = "About"},
    {url = "archive/", name = "Posts"},
    {url = "tags/", name = "Tags"},
]

# Footer links
menu_footer = [
    {url = "about/", name = "About"},
    {url = "contact/", name = "Contact"},
    {url = "privacy/", name = "Privacy"},
    {url = "sitemap.xml", name = "Sitemap"},
]

# Footer social links (omit to hide)
mail = "jay.m.looney@gmail.com"
github = "zenware"
twitter = "jaymlooney"
linkedin = "jaylooney"

